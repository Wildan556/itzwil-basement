    <!-- Pop Pesan -->
            <dialog id="myModal">
                <h2>Kontak Atmin</h2>
                <form method="dialog">
                    <input type="text" placeholder="Nama" required/><br><br>
                    <input type="email" placeholder="Email" required/><br><br>

                    <button type="submit" class="submit-btn">Kirim</button>
                    <button type="button" onclick="document.getElementById('myModal').close()">Batal</button>
                </form>
            </dialog>
